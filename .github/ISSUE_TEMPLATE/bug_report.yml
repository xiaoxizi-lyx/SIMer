name: 🐛 Bug 报告 (Bug Report)
description: 提交一个在 SIMer 中遇到的问题或异常
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题！请尽量提供清晰详尽的复现步骤，以便我们定位和解决。
  - type: textarea
    id: description
    attributes:
      label: 问题描述 (Problem Description)
      description: 请清晰、简明地描述该 Bug 是什么。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 (Steps to Reproduce)
      description: 请详细描述重现该问题的步骤。
      placeholder: |
        1. 打开应用
        2. 点击 ...
        3. 遇到异常 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为 (Expected Behavior)
      description: 正常情况下应用应该有什么表现？
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境 (Environment)
      description: 请提供您的设备系统与应用版本。
      placeholder: |
        - 设备型号: 例如 Pixel 7 / Xiaomi 13
        - Android 版本: 例如 Android 14
        - SIMer 版本: 例如 v1.0.1
    validations:
      required: true
