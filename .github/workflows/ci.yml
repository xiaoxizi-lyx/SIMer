name: SIMer CI

# - push 到 main / PR / 手动触发：格式检查 → 静态分析 → 测试 → 构建 APK（仅上传为工作流产物，不发布）
# - 推送 v* tag：额外校验版本号与正式签名，并发布 GitHub Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 默认只读；只有发布 job 单独申请写权限
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # 与 pubspec.yaml 的 environment.flutter 保持一致
  FLUTTER_VERSION: '3.47.9'
  JAVA_VERSION: '21'

jobs:
  analyze-and-test:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies (locked)
        run: flutter pub get --enforce-lockfile

      # 界面文案：生成的代码必须与 .arb 一致，英文不能缺少任何条目
      - name: Check localizations
        run: |
          flutter gen-l10n
          if ! git diff --exit-code -- lib/l10n; then
            echo "::error::lib/l10n is out of date. Run 'flutter gen-l10n' and commit the result."
            exit 1
          fi
          if grep -q '[^{}[:space:]]' build/l10n_untranslated.json; then
            echo "::error::Untranslated messages:"
            cat build/l10n_untranslated.json
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  build-android:
    name: Build Android APKs
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies (locked)
        run: flutter pub get --enforce-lockfile

      - name: Check tag, pubspec version and changelog entry
        if: env.IS_RELEASE == 'true'
        run: |
          version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${version}"
            exit 1
          fi
          # Release notes are taken from this CHANGELOG section; fail before building if it is missing.
          if ! awk -v ver="${version}" 'index($0, "## [" ver "]") == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' entry"
            exit 1
          fi

      - name: Restore release keystore
        if: env.IS_RELEASE == 'true'
        env:
          SIMER_KEYSTORE_BASE64: ${{ secrets.SIMER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${SIMER_KEYSTORE_BASE64}" ]; then
            echo "::error::Repository secret SIMER_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          # Strip whitespace so secrets pasted with line wraps or CRLF still decode.
          printf '%s' "${SIMER_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${RUNNER_TEMP}/simer-release.jks"
          echo "SIMER_KEYSTORE_FILE=${RUNNER_TEMP}/simer-release.jks" >> "${GITHUB_ENV}"

      # 非 tag 构建拿不到签名密钥，回退到 debug 签名，产物仅用于测试，不得分发
      # 测试包的包名带 .ci 后缀、应用名为「SIMer CI」，可以和正式版同时安装
      - name: Build APKs (CI test build)
        if: env.IS_RELEASE != 'true'
        env:
          SIMER_TEST_BUILD: 'true'
        run: flutter build apk --release --split-per-abi

      - name: Build APKs (release-signed)
        if: env.IS_RELEASE == 'true'
        env:
          SIMER_REQUIRE_RELEASE_SIGNING: 'true'
          SIMER_KEYSTORE_PASSWORD: ${{ secrets.SIMER_KEYSTORE_PASSWORD }}
          SIMER_KEY_ALIAS: ${{ secrets.SIMER_KEY_ALIAS }}
          SIMER_KEY_PASSWORD: ${{ secrets.SIMER_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Remove release keystore
        if: always() && env.IS_RELEASE == 'true'
        run: rm -f "${RUNNER_TEMP}/simer-release.jks"

      # 守住两条承诺：正式版没有网络权限；发布包不是 debug 签名
      - name: Verify APK permissions and signature
        run: |
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "Using ${build_tools}"
          expected_package="io.github.xiaoxizi_lyx.simer"
          if [ "${IS_RELEASE}" != "true" ]; then
            expected_package="${expected_package}.ci"
          fi
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "== ${apk}"
            permissions="$("${build_tools}/aapt2" dump permissions "${apk}")"
            echo "${permissions}"
            package="$(echo "${permissions}" | sed -n 's/^package: //p')"
            if [ "${package}" != "${expected_package}" ]; then
              echo "::error::${apk} has package name '${package}', expected '${expected_package}'"
              exit 1
            fi
            # Both checks must fail closed: if the tool output cannot be read, stop instead of passing.
            if ! echo "${permissions}" | grep -q "uses-permission"; then
              echo "::error::Could not read the permissions of ${apk}"
              exit 1
            fi
            if echo "${permissions}" | grep -q "android.permission.INTERNET"; then
              echo "::error::${apk} requests the INTERNET permission"
              exit 1
            fi
            if ! certs="$("${build_tools}/apksigner" verify --print-certs "${apk}")"; then
              echo "::error::${apk} failed signature verification"
              exit 1
            fi
            # apksigner prints "Signer #1 certificate DN: ..." up to 36.x and "V2 Signer: certificate DN: ..." from 37.
            dn="$(echo "${certs}" | grep "certificate DN:" || true)"
            if [ -z "${dn}" ]; then
              echo "${certs}"
              echo "::error::Could not read the signing certificate of ${apk}"
              exit 1
            fi
            echo "${certs}" | grep -E "certificate (DN|SHA-256 digest):"
            if [ "${IS_RELEASE}" = "true" ] && echo "${dn}" | grep -q "CN=Android Debug"; then
              echo "::error::${apk} is signed with the Android debug key"
              exit 1
            fi
          done

      - name: Collect APKs and checksums
        run: |
          version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          if [ "${IS_RELEASE}" = "true" ]; then
            label="v${version}"
          else
            label="v${version}-ci-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "dist/SIMer-${label}-${abi}.apk"
          done
          (cd dist && sha256sum ./*.apk | sed 's# \./# #' > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.IS_RELEASE == 'true' && 'release-apks' || 'ci-test-apks' }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ env.IS_RELEASE == 'true' && 30 || 7 }}

  release:
    name: Publish GitHub Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apks
          path: dist

      - name: Compose release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 从 CHANGELOG.md 中截取当前版本的条目
          awk -v ver="${version}" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<EOF

          ---

          ### 📦 下载哪个安装包？
          - **\`SIMer-${GITHUB_REF_NAME}-arm64-v8a.apk\`**：绝大多数 Android 手机（64 位 ARM）请下载这个
          - **\`SIMer-${GITHUB_REF_NAME}-armeabi-v7a.apk\`**：较旧的 32 位 ARM 设备
          - **\`SIMer-${GITHUB_REF_NAME}-x86_64.apk\`**：x86_64 平板、模拟器与 ChromeOS

          所有安装包使用同一正式签名，后续版本可直接覆盖升级。

          ### 🔐 完整性校验
          各安装包的 SHA-256 见附件 \`SHA256SUMS.txt\`。
          EOF
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: SIMer ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
