# SIMer 静态分析配置。CI 中 `flutter analyze` 出现任何问题（含 info）都会失败。
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    # gen-l10n 生成的代码
    - lib/l10n/app_localizations*.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # 未 await 的 Future 往往意味着数据库写入失败被静默吞掉；确实不需要等待时用 unawaited() 标明
    - unawaited_futures
    - discarded_futures
    # 只捕获异常（Exception），不要吞掉编程错误（Error）
    - avoid_catches_without_on_clauses
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - always_declare_return_types
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
