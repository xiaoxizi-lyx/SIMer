name: sim_keeper
description: "SIMer - 现代化 Apple Wallet 风格 SIM 卡与 eSIM 卡信息记录管理应用"
publish_to: 'none'
version: 1.0.0+1
homepage: https://github.com/xiaoxizi-lyx/SIMer
repository: https://github.com/xiaoxizi-lyx/SIMer
issue_tracker: https://github.com/xiaoxizi-lyx/SIMer/issues

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  
  # 数据库
  sqflite: ^2.3.3
  path: ^1.9.0
  
  # 文件与路径
  path_provider: ^2.1.5
  file_picker: ^13.3.2
  
  # 状态管理
  provider: ^6.1.2
  
  # QR码扫描
  mobile_scanner: ^7.5.0
  
  # 通知
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  
  # 生物识别
  local_auth: ^3.0.2
  
  # 分享/导出
  share_plus: ^13.3.1
  
  # 日期
  intl: ^0.20.3
  
  # UUID
  uuid: ^4.5.1
  
  # 颜色选择器
  flutter_colorpicker: ^1.1.0
  
  # SharedPreferences (主题/设置持久化)
  shared_preferences: ^2.3.4
  clock: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    # 内置字体的许可证（显示在「关于 → 开源许可」中）
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-RobotoMono.txt

  # 字体随应用打包，运行时不联网下载
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500
