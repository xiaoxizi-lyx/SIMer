name: sim_keeper
description: "SIMer - 现代化 Apple Wallet 风格 SIM 卡与 eSIM 卡信息记录管理应用"
publish_to: 'none'
version: 1.0.0+1
homepage: https://github.com/xiaoxizi-lyx/SIMer
repository: https://github.com/xiaoxizi-lyx/SIMer
issue_tracker: https://github.com/xiaoxizi-lyx/SIMer/issues

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 数据库
  sqflite: ^2.3.3
  path: ^1.9.0
  
  # 文件与路径
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  
  # 状态管理
  provider: ^6.1.2
  
  # QR码扫描
  mobile_scanner: ^6.0.11
  
  # 通知
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.6.0
  
  # 生物识别
  local_auth: ^2.3.0
  
  # 字体
  google_fonts: ^6.2.1
  
  # 分享/导出
  share_plus: ^10.1.4
  
  # 日期
  intl: ^0.19.0
  
  # UUID
  uuid: ^4.5.1
  
  # 颜色选择器
  flutter_colorpicker: ^1.1.0
  
  # 权限
  permission_handler: ^11.3.1
  
  # SharedPreferences (主题/设置持久化)
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
